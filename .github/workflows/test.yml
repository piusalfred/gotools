name: Test

on:
    push:
        branches: [main]
        paths:
            - "**.go"
            - "go.mod"
            - "go.sum"
            - "version.txt"
            - "install.sh"
            - "Makefile"
            - "test/**"
            - "tools/**"
            - ".gotools.json"
            - ".golangci.yaml"
            - ".pre-commit-config.yaml"
            - ".github/workflows/test.yml"
    pull_request:
        paths:
            - "**.go"
            - "go.mod"
            - "go.sum"
            - "version.txt"
            - "install.sh"
            - "Makefile"
            - "test/**"
            - "tools/**"
            - ".gotools.json"
            - ".golangci.yaml"
            - ".pre-commit-config.yaml"
            - ".github/workflows/test.yml"
    workflow_dispatch: {}

jobs:
    # ------------------------------------------------------------------
    # 1. Static analysis + unit tests — fast feedback. Runs once on Linux.
    # ------------------------------------------------------------------
    static-analysis:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod
                  # The tools (golangci-lint is the big one) have their own go.sum files;
                  # keying the cache on them keeps their build out of every run.
                  cache-dependency-path: |
                      go.sum
                      tools/*/go.sum

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"

            - name: Install pre-commit
              run: pip install pre-commit

            - name: Cache pre-commit environments
              uses: actions/cache@v4
              with:
                  path: ~/.cache/pre-commit
                  key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

            - name: Run pre-commit
              run: pre-commit run --all-files

            - name: Unit tests
              run: go test -race -count=1 ./...

    # ------------------------------------------------------------------
    # 2. Integration tests — matrix across OS, arch, and Go versions.
    #    No Windows support.
    #    Runner labels:
    #      ubuntu-latest       = linux/amd64
    #      macos-latest        = macos/arm64 (Apple Silicon)
    # ------------------------------------------------------------------
    test:
        needs: static-analysis
        strategy:
            fail-fast: false
            matrix:
                runner:
                    - ubuntu-latest # linux/amd64
                    - macos-latest # macos/arm64
                go-version:
                    - stable # the newest Go, so a new release that breaks gotools shows up on the next run
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@v4

            - name: Set up Go ${{ matrix.go-version }}
              uses: actions/setup-go@v5
              with:
                  go-version: ${{ matrix.go-version }}

            - name: Cache Go modules
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cache/go-build
                      ~/go/pkg/mod
                  key: test-${{ matrix.runner }}-go-${{ matrix.go-version }}-${{ hashFiles('go.mod') }}-${{ github.run_id }}
                  restore-keys: |
                      test-${{ matrix.runner }}-go-${{ matrix.go-version }}-${{ hashFiles('go.mod') }}-
                      test-${{ matrix.runner }}-go-${{ matrix.go-version }}-

            - name: Run integration tests
              timeout-minutes: 30
              run: go test -tags integration -timeout 30m -count=1 ./test/...
