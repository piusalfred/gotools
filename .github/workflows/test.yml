name: Test

on:
    push:
        branches: [main]
        paths:
            - "gotools.sh"
            - "lib/**"
            - "build/**"
            - "gotools.go"
            - "cmd/**"
            - "go.mod"
            - "go.sum"
            - "test/**"
            - ".github/workflows/test.yml"
    pull_request:
        paths:
            - "gotools.sh"
            - "lib/**"
            - "build/**"
            - "gotools.go"
            - "cmd/**"
            - "go.mod"
            - "go.sum"
            - "test/**"
            - ".github/workflows/test.yml"
    schedule:
        - cron: "57 3 * * 0" # 03:57 UTC every Sunday
    workflow_dispatch: {}

jobs:
    # ------------------------------------------------------------------
    # 1. Static analysis + unit tests — fast feedback. Runs once on Linux.
    # ------------------------------------------------------------------
    static-analysis:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"

            - name: Install pre-commit
              run: pip install pre-commit

            - name: Cache pre-commit environments
              uses: actions/cache@v4
              with:
                  path: ~/.cache/pre-commit
                  key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

            - name: Run pre-commit
              run: pre-commit run --all-files

            - name: Verify bundled script is in sync
              run: make check-bundle

            - name: Unit tests
              run: bash test/unit/run_all.sh

    # ------------------------------------------------------------------
    # 2. Integration tests — matrix across OS, arch, and Go versions.
    #    No Windows support.
    #    Runner labels:
    #      ubuntu-latest       = linux/amd64
    #      macos-latest        = macos/arm64 (Apple Silicon)
    # ------------------------------------------------------------------
    test:
        needs: static-analysis
        strategy:
            fail-fast: false
            matrix:
                runner:
                    - ubuntu-latest       # linux/amd64
                    - macos-latest        # macos/arm64
                go-version:
                    - "1.26"  # current stable
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@v4

            - name: Set up Go ${{ matrix.go-version }}
              uses: actions/setup-go@v5
              with:
                  go-version: ${{ matrix.go-version }}

            - name: Cache Go modules
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cache/go-build
                      ~/go/pkg/mod
                  key: test-${{ matrix.runner }}-go-${{ matrix.go-version }}-${{ hashFiles('go.mod') }}-${{ github.run_id }}
                  restore-keys: |
                      test-${{ matrix.runner }}-go-${{ matrix.go-version }}-${{ hashFiles('go.mod') }}-
                      test-${{ matrix.runner }}-go-${{ matrix.go-version }}-

            - name: Run integration tests
              timeout-minutes: 15
              run: |
                  cd test && bash test.sh

    # ------------------------------------------------------------------
    # 3. Build — smoke test that the Go wrapper compiles on each platform.
    # ------------------------------------------------------------------
    build:
        needs: static-analysis
        strategy:
            fail-fast: false
            matrix:
                runner:
                    - ubuntu-latest
                    - macos-latest
                go-version:
                    - "1.26"
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@v4

            - name: Set up Go ${{ matrix.go-version }}
              uses: actions/setup-go@v5
              with:
                  go-version: ${{ matrix.go-version }}

            - name: Build
              run: go build -trimpath -ldflags="-s -w" -o /dev/null ./cmd/gotools

    # ------------------------------------------------------------------
    # 4. Retry on failure — scheduled runs only.
    #    Absorbs transient network/proxy issues. PR/push failures are
    #    NOT retried so flaky tests stay visible.
    # ------------------------------------------------------------------
    test-retry:
        needs: test
        if: failure() && github.event_name == 'schedule'
        strategy:
            fail-fast: false
            matrix:
                runner:
                    - ubuntu-latest
                    - macos-latest
                go-version:
                    - "1.26"
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@v4

            - name: Set up Go ${{ matrix.go-version }}
              uses: actions/setup-go@v5
              with:
                  go-version: ${{ matrix.go-version }}

            - name: Cache Go modules
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cache/go-build
                      ~/go/pkg/mod
                  key: retry-${{ matrix.runner }}-go-${{ matrix.go-version }}-${{ hashFiles('go.mod') }}-${{ github.run_id }}
                  restore-keys: |
                      retry-${{ matrix.runner }}-go-${{ matrix.go-version }}-${{ hashFiles('go.mod') }}-
                      retry-${{ matrix.runner }}-go-${{ matrix.go-version }}-

            - name: Retry integration tests
              timeout-minutes: 15
              run: |
                  cd test && bash test.sh
