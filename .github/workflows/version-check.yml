name: Version Guard
on:
    # Only gate PRs intended for main — merging to main is the release step
    # that requires a VERSION bump in gotools.sh. PRs targeting other
    # branches (e.g. dev) must not run this check.
    pull_request:
        branches: [main]
        types: [opened, synchronize, reopened, ready_for_review]
        paths: ["gotools.sh"]
    # Direct pushes to main must bump as well — nothing reaches main with a
    # stale VERSION, no matter how it got there.
    push:
        branches: [main]
        paths: ["gotools.sh"]

jobs:
    check-version:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Verify Version Increment
              # On pull_request the base is the PR target; on push it is the
              # branch itself (github.base_ref is empty there).
              run: make version-check BASE=origin/${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
