name: Production Release
on:
    # Release only after the Test workflow passed on a main PUSH — never on
    # an untested commit, and never on a PR run (the code may not be merged).
    workflow_run:
        workflows: [Test]
        types: [completed]
        branches: [main]

# Two Test runs finishing close together would both see the same latest
# release and both publish it. Queue them so the second sees the first.
concurrency:
    group: production-release
    cancel-in-progress: false

jobs:
    # ------------------------------------------------------------------
    # 0. Gate: only proceed when CI passed on a push to main.
    # ------------------------------------------------------------------
    guard:
        runs-on: ubuntu-latest
        if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
        steps:
            - run: echo "✅ Test workflow passed on a main push — release may proceed"

    # ------------------------------------------------------------------
    # 1. Decide whether version.txt is ahead of the latest published release.
    #    Comparing with the latest release (not with the previous commit)
    #    means a version whose Test run never passed or never ran is still
    #    released by the next green push, and a push that leaves version.txt
    #    alone releases nothing.
    # ------------------------------------------------------------------
    meta:
        needs: guard
        runs-on: ubuntu-latest
        outputs:
            tag: ${{ steps.meta.outputs.tag }}
            release: ${{ steps.meta.outputs.release }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}

            - name: Compare version.txt with the latest release
              id: meta
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  new=$(make get-version)
                  if ! printf '%s' "$new" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-+][A-Za-z0-9.-]+)?$'; then
                      echo "::error::version.txt must hold a version like v1.2.3, not '$new'"
                      exit 1
                  fi
                  echo "tag=$new" >> "$GITHUB_OUTPUT"

                  # No release yet is not an error: the first one is cut.
                  latest=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
                  echo "version.txt: $new, latest release: ${latest:-none}"

                  if [ -z "$latest" ]; then
                      echo "release=true" >> "$GITHUB_OUTPUT"
                  elif [ "$new" = "$latest" ]; then
                      echo "release=false" >> "$GITHUB_OUTPUT"
                      echo "$new is already released; nothing to do"
                  elif [ "$(printf '%s\n%s\n' "$latest" "$new" | sort -V | tail -n 1)" = "$new" ]; then
                      echo "release=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "::error::version.txt ($new) is behind the latest release ($latest)"
                      exit 1
                  fi

    # ------------------------------------------------------------------
    # 2. Cross-compile the Go binary for each OS/arch combination
    # ------------------------------------------------------------------
    build:
        needs: meta
        if: needs.meta.outputs.release == 'true'
        runs-on: ubuntu-latest
        strategy:
            matrix:
                include:
                    - goos: linux
                      goarch: amd64
                    - goos: linux
                      goarch: arm64
                    - goos: darwin
                      goarch: amd64
                    - goos: darwin
                      goarch: arm64
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod

            - name: Build
              env:
                  CGO_ENABLED: "0"
                  GOOS: ${{ matrix.goos }}
                  GOARCH: ${{ matrix.goarch }}
              run: |
                  EXT=""
                  if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi

                  BINARY="gotools-${GOOS}-${GOARCH}${EXT}"
                  go build -trimpath \
                      -ldflags="-s -w" \
                      -o "dist/${BINARY}" \
                      ./cmd/gotools

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: gotools-${{ matrix.goos }}-${{ matrix.goarch }}
                  path: dist/*
                  retention-days: 1

    # ------------------------------------------------------------------
    # 3. Create the GitHub release with all binaries and their checksums
    # ------------------------------------------------------------------
    release:
        needs: [meta, build]
        if: needs.meta.outputs.release == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}

            - name: Download all artifacts
              uses: actions/download-artifact@v4
              with:
                  path: dist
                  merge-multiple: true

            - name: Smoke-test the binary built for the runner
              run: |
                  chmod +x dist/gotools-linux-amd64
                  env -i PATH=/nonexistent dist/gotools-linux-amd64 version

            - name: Publish the installer, stamped with this release's version
              env:
                  TAG: ${{ needs.meta.outputs.tag }}
              run: |
                  # The copy attached to the release installs the release it is
                  # attached to, and its hash goes in the manifest below, so the
                  # installer can be verified like the binaries.
                  sed "s/^DEFAULT_VERSION=.*/DEFAULT_VERSION=\"${TAG}\"/" install.sh > dist/install.sh
                  grep -qx "DEFAULT_VERSION=\"${TAG}\"" dist/install.sh
                  chmod +x dist/install.sh

            - name: Generate checksums
              run: |
                  # install.sh and self-update verify downloads against this manifest
                  (cd dist && sha256sum gotools-* install.sh > checksums-sha256.txt)

            - name: Tag and Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ needs.meta.outputs.tag }}
                  name: Release ${{ needs.meta.outputs.tag }}
                  body: |
                      ## Install

                      **Prebuilt binary** (no Go required, SHA-256 verified). The installer is
                      attached to this release and listed in `checksums-sha256.txt`:
                      ```
                      curl -fsSLO https://github.com/${{ github.repository }}/releases/download/${{ needs.meta.outputs.tag }}/install.sh
                      curl -fsSLO https://github.com/${{ github.repository }}/releases/download/${{ needs.meta.outputs.tag }}/checksums-sha256.txt
                      grep ' install.sh$' checksums-sha256.txt | shasum -a 256 -c -   # sha256sum -c - on Linux
                      bash install.sh
                      ```

                      **With Go** (verified by the Go checksum database):
                      ```
                      go install github.com/piusalfred/gotools/cmd/gotools@${{ needs.meta.outputs.tag }}
                      ```

                      **Upgrade an existing install:**
                      ```
                      gotools self-update
                      ```
                  files: |
                      dist/*
                  generate_release_notes: true
