repos:
    - repo: https://github.com/shellcheck-py/shellcheck-py
      rev: v0.11.0.1
      hooks:
          - id: shellcheck
            args: ["--severity=warning"]
            # install.sh and the version hook are the only shell scripts left.
            files: ^(install\.sh|build/.*\.sh)$
    - repo: local
      hooks:
          - id: lint-license
            name: license check
            language: system
            entry: make lint-license
            pass_filenames: false
            always_run: true
          - id: lint-go-vet
            name: go vet
            language: system
            entry: make lint-go-vet
            pass_filenames: false
            always_run: true
          - id: lint-golangci
            name: golangci-lint
            language: system
            entry: make lint-golangci
            pass_filenames: false
            always_run: true
          - id: govulncheck
            name: govulncheck
            language: system
            entry: make govulncheck
            pass_filenames: false
            always_run: true
          - id: version-check
            name: version check
            language: system
            entry: bash build/version-check-hook.sh
            pass_filenames: false
            always_run: true
    - repo: https://github.com/rvben/rumdl-pre-commit
      rev: v0.3.0
      hooks:
          - id: rumdl # Lint only (fails on issues)
          - id: rumdl-fmt
