repos:
    - repo: https://github.com/shellcheck-py/shellcheck-py
      rev: v0.11.0.1
      hooks:
          - id: shellcheck
            args: ["--severity=warning"]
            # lib/*.sh modules share globals across files, so per-file linting
            # produces SC2154 noise. The bundled gotools.sh is the shipped
            # artifact and is linted instead; `make check-bundle` guarantees
            # lib/ and gotools.sh stay in sync.
            files: ^(gotools\.sh|install\.sh|test/.*\.sh|build/.*\.sh)$
    - repo: local
      hooks:
          - id: lint-license
            name: license check
            language: system
            entry: make lint-license
            pass_filenames: false
            always_run: true
          - id: lint-go-vet
            name: go vet
            language: system
            entry: make lint-go-vet
            pass_filenames: false
            always_run: true
          - id: lint-imports
            name: import ordering
            language: system
            entry: make lint-imports
            pass_filenames: false
            always_run: true
          - id: lint-go-fmt
            name: go formatting
            language: system
            entry: make lint-go-fmt
            pass_filenames: false
            always_run: true
          - id: govulncheck
            name: govulncheck
            language: system
            entry: make govulncheck
            pass_filenames: false
            always_run: true
          - id: lint-staticcheck
            name: staticcheck
            language: system
            entry: make lint-staticcheck
            pass_filenames: false
            always_run: true
          - id: version-check
            name: version check
            language: system
            entry: bash build/version-check-hook.sh
            pass_filenames: false
            always_run: true
    - repo: https://github.com/rvben/rumdl-pre-commit
      rev: v0.1.58
      hooks:
          - id: rumdl # Lint only (fails on issues)
          - id: rumdl-fmt
